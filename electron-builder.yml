appId: com.projectlens.app
# Keep the legacy identifier so existing installations upgrade in place.
productName: RepoPrep
directories:
  buildResources: build
extraResources:
  - from: resources/icon.png
    to: icon.png
files:
  - out/**
  # 注意：不要用 "!node_modules/**" 一刀切。main 进程运行时会 require 生产依赖
  # 依赖以 package.json 与实际主进程产物为准，排除后应用可能无法启动。
  # 若要精简包体，只排除确认「已被 Vite 打进 out/renderer」的渲染进程专用依赖。
  - "!**/node_modules/**/.*"
  - package.json
win:
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: RepoPrep-${version}-${arch}-Setup.${ext}
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: false
  selectPerMachineByDefault: false
  packElevateHelper: false
  createDesktopShortcut: true
  shortcutName: RepoPrep
